          font-size="42" font-weight="700" fill="#ffffff">こちらをタップ</text>
  </g>

  <text x="520" y="855" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif"
        font-size="30" font-weight="600" fill="#7c2d12">緊急時は119または救急受診を優先してください</text>
