<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eef9f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#9aa6a0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1040" height="1040" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="92" fill="#d8ecff" opacity="0.75"/>
  <circle cx="880" cy="190" r="118" fill="#ffe0e0" opacity="0.7"/>
  <circle cx="875" cy="850" r="150" fill="#dff4d8" opacity="0.55"/>
  <circle cx="160" cy="865" r="130" fill="#f7e3ff" opacity="0.45"/>

  <g filter="url(#shadow)">
    <rect x="92" y="110" width="856" height="820" rx="48" fill="#ffffff"/>
  </g>

  <g transform="translate(0 8)">
    <circle cx="520" cy="295" r="118" fill="#dcf3ed"/>
    <path d="M454 295c0-39 29-69 66-69s66 30 66 69-29 69-66 69-66-30-66-69z" fill="#ffffff"/>
    <path d="M508 246h26v36h36v26h-36v36h-26v-36h-36v-26h36z" fill="#0f766e"/>
    <path d="M397 405c42-41 86-61 123-61s81 20 123 61" fill="none" stroke="#0f766e" stroke-width="24" stroke-linecap="round"/>
  </g>

  <text x="520" y="525" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif"
        font-size="54" font-weight="700" fill="#1f2933">夜間休日相談フォーム</text>

  <text x="520" y="620" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif"
