<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>相談コード交付 受付管理</title>
  <style>
    :root {
      color: #1f2933;
      background: #f7f7f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f4;
      font-size: 1rem;
    }

    main {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.45rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 12px;
      line-height: 1.6;
    }

    label {
      font-weight: 700;
      line-height: 1.45;
    }

    input,
    button {
      width: 100%;
      min-height: 2.7rem;
      font: inherit;
      letter-spacing: 0;
    }

    input {
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      padding: 0.66rem 0.72rem;
      background: #ffffff;
      color: #1f2933;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: #0f766e;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      background: #91a3ad;
    }

    .screen {
      display: grid;
      gap: 16px;
    }

    .panel {
      padding: 18px;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      background: #ffffff;
    }

    .login-form,
    .staff-form,
    .filters {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .refresh-button {
      width: auto;
      min-width: 9rem;
      padding: 0 1rem;
      background: #334e68;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
    }

    .segmented button {
      min-height: 2.5rem;
      border-radius: 0;
      background: #ffffff;
      color: #1f2933;
      border-right: 1px solid #cbd2d9;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button.active {
      background: #0f766e;
      color: #ffffff;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric {
      padding: 12px;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      background: #ffffff;
    }

    .metric-label {
      color: #52606d;
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .patient-list {
      display: grid;
      gap: 10px;
    }

    .patient-row {
      display: grid;
      grid-template-columns: 1.1fr 1.35fr 0.9fr 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      background: #ffffff;
    }

    .label {
      color: #52606d;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .value {
      margin-top: 3px;
      font-weight: 800;
      line-height: 1.35;
      word-break: break-word;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 2rem;
      padding: 0 0.7rem;
      border-radius: 999px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .status-on {
      background: #dcfce7;
      color: #166534;
    }

    .status-off {
      background: #fef3c7;
      color: #92400e;
    }

    .activate-button {
      width: auto;
      min-width: 8rem;
      padding: 0 1rem;
    }

    .muted {
      color: #52606d;
      font-size: 0.92rem;
    }

    .error,
    .notice {
      display: none;
      padding: 12px 14px;
      border-radius: 6px;
      line-height: 1.6;
      font-weight: 700;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .notice {
      background: #ecfdf5;
      color: #0f766e;
    }

    .empty {
      padding: 18px;
      border: 1px dashed #cbd2d9;
      border-radius: 8px;
      background: #ffffff;
      color: #52606d;
      text-align: center;
      line-height: 1.6;
    }

    #appScreen {
      display: none;
    }

    @media (max-width: 820px) {
      :root {
        font-size: 18px;
      }

      .toolbar,
      .summary,
      .patient-row {
        grid-template-columns: 1fr;
      }

      .refresh-button,
      .activate-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section id="loginScreen" class="screen">
      <div>
        <h1>相談コード交付 受付管理</h1>
        <p class="muted">受付でLINE QRコードと相談コードを渡した患者さんだけを有効化します。</p>
      </div>

      <form id="loginForm" class="panel login-form">
        <div class="field">
          <label for="pinInput">受付管理用PIN</label>
          <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required>
        </div>
        <button id="loginButton" type="submit">開く</button>
        <div id="loginError" class="error"></div>
      </form>
    </section>

    <section id="appScreen" class="screen">
      <div class="toolbar">
        <div>
          <h1>相談コード交付 受付管理</h1>
          <p id="generatedAt" class="muted"></p>
        </div>
        <button id="refreshButton" class="refresh-button" type="button">再読み込み</button>
      </div>

      <form id="staffForm" class="panel staff-form">
        <div class="field">
          <label for="staffNameInput">担当者名</label>
          <input id="staffNameInput" type="text" autocomplete="name" placeholder="例: 受付 田中" required>
        </div>
      </form>

      <div class="summary">
        <div class="metric">
          <div class="metric-label">未交付</div>
          <div id="pendingCount" class="metric-value">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">交付済み</div>
          <div id="enabledCount" class="metric-value">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">登録数</div>
          <div id="totalCount" class="metric-value">0</div>
        </div>
      </div>

      <section class="panel filters" aria-label="検索と表示切り替え">
        <div class="field">
          <label for="searchInput">患者ID・相談コードで検索</label>
          <input id="searchInput" type="search" autocomplete="off" placeholder="例: 00850 または ABCD">
        </div>
        <div class="segmented" aria-label="表示対象">
          <button class="active" type="button" data-filter="pending">未交付</button>
          <button type="button" data-filter="enabled">交付済み</button>
          <button type="button" data-filter="all">すべて</button>
        </div>
      </section>

      <div id="appNotice" class="notice"></div>
      <div id="appError" class="error"></div>
      <div id="patientList" class="patient-list"></div>
    </section>
  </main>

  <script>
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const pinInput = document.getElementById('pinInput');
    const loginError = document.getElementById('loginError');
    const staffNameInput = document.getElementById('staffNameInput');
    const refreshButton = document.getElementById('refreshButton');
    const generatedAt = document.getElementById('generatedAt');
    const pendingCount = document.getElementById('pendingCount');
    const enabledCount = document.getElementById('enabledCount');
    const totalCount = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = Array.from(document.querySelectorAll('[data-filter]'));
    const appNotice = document.getElementById('appNotice');
    const appError = document.getElementById('appError');
    const patientList = document.getElementById('patientList');

    let auth = null;
    let patients = [];
    let activeFilter = 'pending';

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      auth = { pin: pinInput.value };
      loadPatients(true);
    });

    refreshButton.addEventListener('click', () => loadPatients(false));
    searchInput.addEventListener('input', renderPatients);

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        filterButtons.forEach((item) => item.classList.toggle('active', item === button));
        renderPatients();
      });
    });

    function loadPatients(isLogin) {
      hideMessages();
      setBusy(isLogin ? loginButton : refreshButton, true, isLogin ? '確認中...' : '読み込み中...');

      if (!canUseGoogleScriptRun()) {
        showLoginError('このページはGoogle Apps ScriptのWebアプリURLから開いてください。');
        setBusy(isLogin ? loginButton : refreshButton, false);
        return;
      }

      google.script.run
        .withSuccessHandler((result) => {
          patients = result.patients || [];
          generatedAt.textContent = result.generatedAt ? `最終読み込み: ${result.generatedAt}` : '';
          loginScreen.style.display = 'none';
          appScreen.style.display = 'grid';
          setBusy(isLogin ? loginButton : refreshButton, false);
          renderPatients();
        })
        .withFailureHandler((error) => {
          setBusy(isLogin ? loginButton : refreshButton, false);
          if (isLogin) {
            showLoginError(error && error.message ? error.message : '開けませんでした。');
          } else {
            showAppError(error && error.message ? error.message : '読み込みできませんでした。');
          }
        })
        .getReceptionPatientList(auth);
    }

    function renderPatients() {
      hideMessages();

      const query = normalizeSearch(searchInput.value);
      const filtered = patients.filter((patient) => {
        const matchesFilter = activeFilter === 'all' ||
          (activeFilter === 'pending' && !patient.enabled) ||
          (activeFilter === 'enabled' && patient.enabled);
        const searchTarget = normalizeSearch(`${patient.patientId} ${patient.consultationCode}`);
        return matchesFilter && (!query || searchTarget.indexOf(query) !== -1);
      });

      const enabled = patients.filter((patient) => patient.enabled).length;
      enabledCount.textContent = String(enabled);
      totalCount.textContent = String(patients.length);
      pendingCount.textContent = String(patients.length - enabled);

      patientList.innerHTML = '';
      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '表示する患者さんがありません。';
        patientList.appendChild(empty);
        return;
      }

      filtered.forEach((patient) => {
        patientList.appendChild(createPatientRow(patient));
      });
    }

    function createPatientRow(patient) {
      const row = document.createElement('div');
      row.className = 'patient-row';
      row.dataset.rowNumber = patient.rowNumber;

      row.appendChild(createTextBlock('患者ID', patient.patientId || '-'));
      row.appendChild(createTextBlock('相談コード', patient.consultationCode || '-'));

      const statusBlock = document.createElement('div');
      const status = document.createElement('span');
      status.className = `status ${patient.enabled ? 'status-on' : 'status-off'}`;
      status.textContent = patient.enabled ? '交付済み' : '未交付';
      statusBlock.appendChild(status);
      row.appendChild(statusBlock);

      row.appendChild(createTextBlock('有効化', patient.enabledAt ? `${patient.enabledAt} ${patient.enabledBy}` : '-'));

      const action = document.createElement('div');
      if (patient.enabled) {
        const memo = document.createElement('div');
        memo.className = 'muted';
        memo.textContent = patient.memo || '';
        action.appendChild(memo);
      } else {
        const button = document.createElement('button');
        button.className = 'activate-button';
        button.type = 'button';
        button.textContent = 'TRUEにする';
        button.addEventListener('click', () => activatePatient(patient, button));
        action.appendChild(button);
      }
      row.appendChild(action);

      return row;
    }

    function createTextBlock(labelText, valueText) {
      const block = document.createElement('div');
      const label = document.createElement('div');
      const value = document.createElement('div');
      label.className = 'label';
      value.className = 'value';
      label.textContent = labelText;
      value.textContent = valueText;
      block.appendChild(label);
      block.appendChild(value);
      return block;
    }

    function activatePatient(patient, button) {
      hideMessages();
      const staffName = staffNameInput.value.trim();
      if (!staffName) {
        showAppError('担当者名を入力してください。');
        staffNameInput.focus();
        return;
      }

      setBusy(button, true, '更新中...');
      google.script.run
        .withSuccessHandler((result) => {
          const target = patients.find((item) => item.rowNumber === result.rowNumber);
          if (target) {
            target.enabled = true;
            target.enabledAt = result.enabledAt;
            target.enabledBy = result.enabledBy;
          }
          renderPatients();
          showAppNotice(`${target ? target.patientId : '対象患者'} をTRUEにしました。`);
        })
        .withFailureHandler((error) => {
          setBusy(button, false);
          showAppError(error && error.message ? error.message : '更新できませんでした。');
        })
        .activateReceptionPatient({
          auth,
          rowNumber: patient.rowNumber,
          staffName
        });
    }

    function setBusy(button, busy, busyText) {
      button.disabled = busy;
      if (busy) {
        button.dataset.originalText = button.dataset.originalText || button.textContent;
        button.textContent = busyText;
      } else if (button.dataset.originalText) {
        button.textContent = button.dataset.originalText;
      }
    }

    function hideMessages() {
      loginError.style.display = 'none';
      appError.style.display = 'none';
      appNotice.style.display = 'none';
      loginError.textContent = '';
      appError.textContent = '';
      appNotice.textContent = '';
    }

    function showLoginError(message) {
      loginError.textContent = message;
      loginError.style.display = 'block';
    }

    function showAppError(message) {
      appError.textContent = message;
      appError.style.display = 'block';
    }

    function showAppNotice(message) {
      appNotice.textContent = message;
      appNotice.style.display = 'block';
    }

    function normalizeSearch(value) {
      return String(value || '').toUpperCase().replace(/\s+/g, '');
    }

    function canUseGoogleScriptRun() {
      return Boolean(
        window.google &&
        google.script &&
        google.script.run
      );
    }
  </script>
</body>
</html>
